[package]
name = "ironroot-web-v3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WASM web preview of IRONROOT for deveraux.dev MUD client. Engine-free V1; same Mulberry32 RNG as the canonical Steam build. Ported verbatim from v2 ironroot-web (2026-08-15)."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "Window",
]

[lints]
workspace = true
