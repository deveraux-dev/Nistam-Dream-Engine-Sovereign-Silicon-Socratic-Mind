[package]
name = "forge-massops-wire-v3"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# The downstream wire layer forge-core-v3::organs::{massread,massweld}'s own
# module docs name as the fill for their documented serialization gap — those
# crate-zero modules stay serde-free; this crate holds the deps they can't.
[dependencies]
forge_core = { package = "forge-core-v3", path = "../forge-core-v3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"

[lints]
workspace = true
