<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>13Forge v3 — World Mandala Aerial Blueprint</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090a0d;
      color: #e0d8c3;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 26px;
      letter-spacing: 3px;
      color: #e6c67a;
      text-transform: uppercase;
    }
    p.sub {
      margin: 0;
      font-size: 14px;
      color: #8c8268;
    }
    .map-container {
      width: 92vw;
      max-width: 1100px;
      height: 92vw;
      max-height: 1100px;
      border: 2px solid #3d3725;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      overflow: hidden;
      margin-bottom: 30px;
      background: #12141a;
    }
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>13Forge v3 — Flat Aerial Top-Down World Mandala</h1>
    <p class="sub">13-Zone World Topology • 13-Moon Quincunx Traversal (+5 mod 12) • 14.3 km² Contiguous Landmass</p>
  </header>
  <div class="map-container">
    <object type="image/svg+xml" data="world_mandala_aerial.svg" style="width:100%; height:100%;"></object>
  </div>
</body>
</html>
